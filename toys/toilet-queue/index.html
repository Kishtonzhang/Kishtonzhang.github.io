.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;toilet-queue-sim&quot; class=&quot;toilet-sim&quot;&gt;
  &lt;style&gt;
    #toilet-queue-sim { color: var(--foreground); font-size: var(--font-size-base); }
    #toilet-queue-sim .sim-layout { display:grid; gap:16px; }

    #toilet-queue-sim canvas { width:100%; height:100%; display:block; }
    #toilet-queue-sim .sim-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }

    #toilet-queue-sim .sim-stat span { color:var(--muted-foreground); }
    #toilet-queue-sim .sim-note { color:var(--muted-foreground); margin:0; }
    #toilet-queue-sim .sim-title { margin:0; font-family:Georgia,serif; font-size:clamp(24px,4vw,34px); font-weight:500; letter-spacing:.01em; }
    #toilet-queue-sim .sim-subtitle { margin:-8px 0 4px; color:var(--muted-foreground); }
    #toilet-queue-sim .sim-section-label { margin:8px 0 -8px; color:var(--muted-foreground); font-size:.78em; font-weight:500; letter-spacing:.08em; text-transform:uppercase; }
    #toilet-queue-sim .sim-controls { border-top:1px solid var(--border); padding-top:12px; }
    #toilet-queue-sim .sim-controls label { min-height:48px; }
    #toilet-queue-sim .sim-canvas-wrap { border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:12px 0; }
    #toilet-queue-sim .sim-summary { border-bottom:1px solid var(--border); padding-bottom:8px; }
    #toilet-queue-sim .sim-stat { padding:4px 0 12px; }
    #toilet-queue-sim .sim-stat + .sim-stat { border-left:1px solid var(--border); padding-left:16px; }
    #toilet-queue-sim .btn { cursor:pointer; }
    #toilet-queue-sim .form-range { accent-color:var(--primary); }
    @media (max-width:620px) { #toilet-queue-sim .sim-controls { grid-template-columns:repeat(2,minmax(120px,1fr)); } #toilet-queue-sim .sim-summary { grid-template-columns:1fr; } #toilet-queue-sim .sim-canvas-wrap { aspect-ratio:1 / 1.4; min-height:420px; } }
  &lt;/style&gt;
  &lt;div class=&quot;sim-layout&quot;&gt;
    &lt;h1 class=&quot;sim-title&quot;&gt;卫生间排队模拟&lt;/h1&gt;
    &lt;p class=&quot;sim-subtitle&quot;&gt;两类服务池、随机到达与服务时间冲击&lt;/p&gt;
    &lt;p class=&quot;sim-section-label&quot;&gt;系统参数&lt;/p&gt;
    &lt;div class=&quot;viz-controls sim-controls&quot; aria-label=&quot;模拟参数&quot;&gt;
      &lt;label class=&quot;form-label&quot;&gt;男性到达 &lt;output id=&quot;m-rate-out&quot;&gt;8 人/分&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;m-rate&quot; type=&quot;range&quot; min=&quot;3&quot; max=&quot;18&quot; value=&quot;8&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;女性到达 &lt;output id=&quot;w-rate-out&quot;&gt;8 人/分&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;w-rate&quot; type=&quot;range&quot; min=&quot;3&quot; max=&quot;18&quot; value=&quot;8&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;A1 位数 &lt;output id=&quot;a1-out&quot;&gt;4&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;a1&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;A2 位数 &lt;output id=&quot;a2-out&quot;&gt;4&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;a2&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;B 位数 &lt;output id=&quot;b-out&quot;&gt;6&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;b&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;6&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;外生类型 1 比例 &lt;output id=&quot;a1-choice-out&quot;&gt;A1/B1 60% · A2/B2 40%&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;a1-choice&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;使用收益 R &lt;output id=&quot;reward-out&quot;&gt;10 效用&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;reward&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;10&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;等待成本 c &lt;output id=&quot;wait-cost-out&quot;&gt;0.5 效用/秒&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;wait-cost&quot; type=&quot;range&quot; min=&quot;0.1&quot; max=&quot;2&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;p class=&quot;sim-section-label&quot;&gt;运行控制&lt;/p&gt;
    &lt;div class=&quot;viz-controls sim-controls&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;toggle&quot;&gt;暂停&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;reset&quot;&gt;重新开始&lt;/button&gt;
      &lt;span class=&quot;viz-badge&quot; id=&quot;clock&quot;&gt;模拟时间 00:00&lt;/span&gt;
      &lt;span class=&quot;text-muted text-small&quot;&gt;A1 满员时，只有 A2 有空位才立即转入；否则继续等待 A1。&lt;/span&gt;
    &lt;/div&gt;
    &lt;p class=&quot;sim-section-label&quot;&gt;外生冲击&lt;/p&gt;
    &lt;div class=&quot;viz-controls sim-controls&quot; aria-label=&quot;外生冲击概率&quot;&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; id=&quot;phone-enabled&quot; type=&quot;checkbox&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;启用玩手机冲击&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;玩手机概率 &lt;output id=&quot;phone-prob-out&quot;&gt;30%（+60 秒）&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;phone-prob&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;30&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; id=&quot;menstruation-enabled&quot; type=&quot;checkbox&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;启用月经冲击（仅 B）&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;月经概率（仅 B） &lt;output id=&quot;menstruation-prob-out&quot;&gt;20%（+120 秒）&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;menstruation-prob&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;20&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;sim-canvas-wrap&quot;&gt;&lt;canvas id=&quot;queue-canvas&quot; role=&quot;img&quot; aria-label=&quot;男性使用分开的 A1 与 A2，女性的 B1 与 B2 类型共同使用 B 服务区的动态模拟&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
    &lt;div class=&quot;sim-summary&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div class=&quot;sim-stat&quot;&gt;&lt;span&gt;男性平均等待（已入服务）&lt;/span&gt;&lt;strong id=&quot;male-wait&quot;&gt;0.0 秒&lt;/strong&gt;&lt;/div&gt;
      &lt;div class=&quot;sim-stat&quot;&gt;&lt;span&gt;女性平均等待（已入服务）&lt;/span&gt;&lt;strong id=&quot;female-wait&quot;&gt;0.0 秒&lt;/strong&gt;&lt;/div&gt;
      &lt;div class=&quot;sim-stat&quot;&gt;&lt;span&gt;累计完成 / 总福利（已入服务）&lt;/span&gt;&lt;strong id=&quot;done&quot;&gt;0 / 0 效用&lt;/strong&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;sim-note text-small&quot;&gt;圆点为男性；方块为 B1 女性；菱形为 B2 女性。平均等待仅对已入服务者计算；福利 = R × 已入服务人数 − c × 已实现等待时间。&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;toilet-queue-sim&#x27;);
    const c = root.querySelector(&#x27;#queue-canvas&#x27;), ctx = c.getContext(&#x27;2d&#x27;);
    const $ = id =&gt; root.querySelector(&#x27;#&#x27; + id);
    const inputs = [&#x27;m-rate&#x27;,&#x27;w-rate&#x27;,&#x27;a1&#x27;,&#x27;a2&#x27;,&#x27;b&#x27;,&#x27;a1-choice&#x27;,&#x27;reward&#x27;,&#x27;wait-cost&#x27;].map($);
    const colors = { ink:&#x27;var(--foreground)&#x27;, muted:&#x27;var(--muted-foreground)&#x27;, line:&#x27;var(--border)&#x27;, male:&#x27;var(--viz-series-1)&#x27;, female:&#x27;var(--viz-series-2)&#x27;, a2:&#x27;var(--viz-series-3)&#x27; };
    let running = true, t = 0, last = performance.now(), arrivals = {m:0,w:0}, completed = {m:0,w:0}, waitSum = {m:0,w:0};
    let queues, pools, exits;
    const rand = () =&gt; Math.random();
    const exp = mean =&gt; -Math.log(1-rand()) * mean;
    const normal = (mean, sd, min) =&gt; Math.max(min, mean + sd * Math.sqrt(-2*Math.log(Math.max(rand(),.0001))) * Math.cos(2*Math.PI*rand()));
    const phoneDelay = () =&gt; $(&#x27;phone-enabled&#x27;).checked &amp;&amp; rand() &lt; +$(&#x27;phone-prob&#x27;).value / 100 ? 60 : 0;
    const menstrualDelay = () =&gt; $(&#x27;menstruation-enabled&#x27;).checked &amp;&amp; rand() &lt; +$(&#x27;menstruation-prob&#x27;).value / 100 ? 120 : 0;
    const setup = () =&gt; {
      queues = { a1:[], a2:[], b:[] };
      pools = { a1:[], a2:[], b:[] }; exits=[];
      t=0; arrivals={m:0,w:0}; completed={m:0,w:0}; waitSum={m:0,w:0};
      nextM=exp(60/+$(&#x27;m-rate&#x27;).value); nextW=exp(60/+$(&#x27;w-rate&#x27;).value);
    };
    let nextM, nextW; setup();
    function addPerson(group, type, sex, service) { queues[group].push({ type, sex, arrived:t, service, id:Math.random() }); arrivals[sex]++; }
    function arrive(type) {
      const choosesType1 = rand() &lt; +$(&#x27;a1-choice&#x27;).value / 100;
      if(type===&#x27;w&#x27;) { addPerson(&#x27;b&#x27;,choosesType1?&#x27;b1&#x27;:&#x27;b2&#x27;,&#x27;w&#x27;,(choosesType1?normal(40,7,20):normal(114,32,20))+phoneDelay()+menstrualDelay()); return; }
      if(choosesType1 &amp;&amp; pools.a1.length &gt;= +$(&#x27;a1&#x27;).value &amp;&amp; pools.a2.length &lt; +$(&#x27;a2&#x27;).value) addPerson(&#x27;a2&#x27;,&#x27;m&#x27;,&#x27;m&#x27;,normal(42,9,20)+phoneDelay());
      else if(choosesType1) addPerson(&#x27;a1&#x27;,&#x27;m&#x27;,&#x27;m&#x27;,normal(30,6,15)+phoneDelay());
      else addPerson(&#x27;a2&#x27;,&#x27;m&#x27;,&#x27;m&#x27;,normal(100,10,25)+phoneDelay());
    }
    function serve(group, cap) {
      const p = pools[group], q=queues[group];
      for(let i=p.length-1;i&gt;=0;i--) if(p[i].ends&lt;=t) { const x=p[i]; completed[x.sex]++; waitSum[x.sex]+=x.wait; exits.push({type:x.type,group,started:t,until:t+3}); p.splice(i,1); }
      while(p.length&lt;cap &amp;&amp; q.length) { const x=q.shift(); x.wait=t-x.arrived; x.entered=t; x.ends=t+x.service; p.push(x); }
    }
    function tick(dt) {
      t += dt; exits=exits.filter(x=&gt;x.until&gt;t);
      while(t&gt;=nextM) { arrive(&#x27;m&#x27;); nextM += exp(60/+$(&#x27;m-rate&#x27;).value); }
      while(t&gt;=nextW) { arrive(&#x27;w&#x27;); nextW += exp(60/+$(&#x27;w-rate&#x27;).value); }
      serve(&#x27;a1&#x27;,+$(&#x27;a1&#x27;).value); serve(&#x27;a2&#x27;,+$(&#x27;a2&#x27;).value); serve(&#x27;b&#x27;,+$(&#x27;b&#x27;).value);
    }
    function css(name) { return getComputedStyle(root).getPropertyValue(name).trim(); }
    function enteredCount(sex) {
      return completed[sex]+Object.values(pools).flat().filter(x=&gt;x.sex===sex).length;
    }
    function enteredWait(sex) {
      return waitSum[sex]+Object.values(pools).flat().filter(x=&gt;x.sex===sex).reduce((sum,x)=&gt;sum+x.wait,0);
    }
    function averageWait(sex) {
      const count=enteredCount(sex); return count ? enteredWait(sex)/count : 0;
    }
    function socialWelfare() {
      const entrants=enteredCount(&#x27;m&#x27;)+enteredCount(&#x27;w&#x27;), wait=enteredWait(&#x27;m&#x27;)+enteredWait(&#x27;w&#x27;);
      return entrants*(+$(&#x27;reward&#x27;).value)-wait*(+$(&#x27;wait-cost&#x27;).value);
    }
    function drawPerson(x,y,type,active) {
      ctx.fillStyle = type===&#x27;m&#x27; ? css(&#x27;--viz-series-1&#x27;) : type===&#x27;b1&#x27; ? css(&#x27;--viz-series-2&#x27;) : css(&#x27;--viz-series-4&#x27;);
      ctx.strokeStyle = css(&#x27;--foreground&#x27;); ctx.lineWidth=1;
      ctx.beginPath();
      if(type===&#x27;m&#x27;) ctx.arc(x,y,7,0,Math.PI*2); else if(type===&#x27;b1&#x27;) { ctx.rect(x-6,y-6,12,12); } else { ctx.moveTo(x,y-8); ctx.lineTo(x+8,y); ctx.lineTo(x,y+8); ctx.lineTo(x-8,y); ctx.closePath(); }
      ctx.fill(); if(active) ctx.stroke();
    }
    function drawPool(key, x,y,w,h, label, cap) {
      ctx.strokeStyle=css(&#x27;--border&#x27;); ctx.lineWidth=1.5; ctx.strokeRect(x,y,w,h);
      ctx.fillStyle=css(&#x27;--foreground&#x27;); ctx.font=&#x27;500 14px system-ui&#x27;; ctx.fillText(label+&#x27; · &#x27;+cap+&#x27; 位&#x27;,x,y-9);
      const columns=cap&gt;6?5:3, spacing=(w-32)/(columns-1), p=pools[key]; for(let i=0;i&lt;cap;i++) { const px=x+16+(i%columns)*spacing, py=y+25+Math.floor(i/columns)*32; ctx.strokeStyle=css(&#x27;--border&#x27;); ctx.strokeRect(px-9,py-9,18,18); if(p[i]) { const entering=Math.min(1,(t-p[i].entered)/2.1), sx=x+18, sy=y+h+32; drawPerson(sx+(px-sx)*entering,sy+(py-sy)*entering,p[i].type,true); } }
      const q=queues[key]; const max=Math.min(q.length,8); for(let i=0;i&lt;max;i++) drawPerson(x+18+i*21,y+h+32,q[i].type,false);
      const leaving=exits.filter(e=&gt;e.group===key); leaving.forEach((e,i)=&gt;{ const progress=(t-e.started)/3; drawPerson(x+w-20,y+h+15+progress*25+i*14,e.type,false); });
      ctx.fillStyle=css(&#x27;--muted-foreground&#x27;); ctx.font=&#x27;12px system-ui&#x27;; ctx.fillText(&#x27;队列 &#x27;+q.length,x,y+h+57); if(leaving.length) ctx.fillText(&#x27;↘ 离开&#x27;,x+w-58,y+h+57);
    }
    function render() {
      const rect=c.getBoundingClientRect(), dpr=devicePixelRatio||1; c.width=rect.width*dpr; c.height=rect.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      const W=rect.width,H=rect.height; ctx.clearRect(0,0,W,H); ctx.fillStyle=css(&#x27;--muted-foreground&#x27;); ctx.font=&#x27;12px system-ui&#x27;; ctx.fillText(&#x27;男厕 A：A1 满员时，仅在 A2 有空位时转入&#x27;,20,25);
      const gap=24, blockW=Math.min(220,(W-gap*3)/2), blockH=Math.min(92,H*.18), bBlockH=Math.min(86,H*.18);
      drawPool(&#x27;a1&#x27;,20,60,blockW,blockH,&#x27;A1 · 快速&#x27;,+$(&#x27;a1&#x27;).value);
      drawPool(&#x27;a2&#x27;,40+blockW,60,blockW,blockH,&#x27;A2 · 常规&#x27;,+$(&#x27;a2&#x27;).value);
      const bY=H*.65; ctx.fillText(&#x27;女厕 B：B1/B2 共享同一队列与服务位&#x27;,20,bY-24);
      drawPool(&#x27;b&#x27;,20,bY,Math.min(W-40,blockW*1.8),bBlockH,&#x27;B · B1/B2 共享&#x27;,+$(&#x27;b&#x27;).value);
      $(&#x27;clock&#x27;).textContent=&#x27;模拟时间 &#x27;+String(Math.floor(t/60)).padStart(2,&#x27;0&#x27;)+&#x27;:&#x27;+String(Math.floor(t%60)).padStart(2,&#x27;0&#x27;);
      $(&#x27;male-wait&#x27;).textContent=averageWait(&#x27;m&#x27;).toFixed(1)+&#x27; 秒&#x27;; $(&#x27;female-wait&#x27;).textContent=averageWait(&#x27;w&#x27;).toFixed(1)+&#x27; 秒&#x27;; $(&#x27;done&#x27;).textContent=(completed.m+completed.w)+&#x27; / &#x27;+Math.round(socialWelfare())+&#x27; 效用&#x27;;
    }
    function loop(now) { const dt=Math.min(.5,(now-last)/1000)*7; last=now; if(running) tick(dt); render(); requestAnimationFrame(loop); }
    const reportParams = () =&gt; parent.postMessage({type:&#x27;queue-params&#x27;,mRate:+$(&#x27;m-rate&#x27;).value,wRate:+$(&#x27;w-rate&#x27;).value,phoneProb:+$(&#x27;phone-prob&#x27;).value,menstrualProb:+$(&#x27;menstruation-prob&#x27;).value,phoneEnabled:$(&#x27;phone-enabled&#x27;).checked,menstrualEnabled:$(&#x27;menstruation-enabled&#x27;).checked},&#x27;*&#x27;);
    inputs.forEach(input=&gt;input.addEventListener(&#x27;input&#x27;,()=&gt;{ if(input.id===&#x27;a1-choice&#x27;) { const p=+input.value; $(&#x27;a1-choice-out&#x27;).textContent=&#x27;A1/B1 &#x27;+p+&#x27;% · A2/B2 &#x27;+(100-p)+&#x27;%&#x27;; } else if(input.id===&#x27;reward&#x27;) { $(&#x27;reward-out&#x27;).textContent=input.value+&#x27; 效用&#x27;; } else if(input.id===&#x27;wait-cost&#x27;) { $(&#x27;wait-cost-out&#x27;).textContent=input.value+&#x27; 效用/秒&#x27;; } else { $(input.id+&#x27;-out&#x27;).textContent=(input.id.endsWith(&#x27;rate&#x27;)?input.value+&#x27; 人/分&#x27;:input.value); } reportParams(); }));
    [$(&#x27;phone-prob&#x27;),$(&#x27;menstruation-prob&#x27;)].forEach(input=&gt;input.addEventListener(&#x27;input&#x27;,()=&gt;{ $(input.id+&#x27;-out&#x27;).textContent=input.value+&#x27;%（+&#x27;+(input.id===&#x27;phone-prob&#x27;?60:120)+&#x27; 秒）&#x27;; reportParams(); }));
    [$(&#x27;phone-enabled&#x27;),$(&#x27;menstruation-enabled&#x27;)].forEach(input=&gt;input.addEventListener(&#x27;change&#x27;,reportParams));
    $(&#x27;toggle&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{ running=!running; $(&#x27;toggle&#x27;).textContent=running?&#x27;暂停&#x27;:&#x27;继续&#x27;; });
    $(&#x27;reset&#x27;).addEventListener(&#x27;click&#x27;,setup); requestAnimationFrame(loop);
  })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

<section class="distribution" aria-labelledby="dist-title">
  <h2 id="dist-title">模型变量的分布</h2>
  <p>到达间隔图会随上方 λ 参数实时更新；服务时间为截断正态近似。B1 和 B2 共享 B 的服务位，但服务时间分布不同。</p>
  <div class="dist-grid">
    <div class="dist-chart"><h3 id="m-arrival-title">男性到达间隔（λ = 8 人/分）</h3><svg viewBox="0 0 320 150" role="img" aria-label="男性到达间隔的指数分布"><line class="axis" x1="32" y1="116" x2="306" y2="116"/><line class="axis" x1="32" y1="16" x2="32" y2="116"/><path id="m-arrival-curve" class="curve-m"/><text class="tick" x="30" y="135">0</text><text class="tick" x="156" y="135">10</text><text class="tick" x="284" y="135">20 秒</text><text class="legend" x="42" y="30">短间隔最常见</text></svg></div>
    <div class="dist-chart"><h3 id="w-arrival-title">女性到达间隔（λ = 8 人/分）</h3><svg viewBox="0 0 320 150" role="img" aria-label="女性到达间隔的指数分布"><line class="axis" x1="32" y1="116" x2="306" y2="116"/><line class="axis" x1="32" y1="16" x2="32" y2="116"/><path id="w-arrival-curve" class="curve-w"/><text class="tick" x="30" y="135">0</text><text class="tick" x="156" y="135">10</text><text class="tick" x="284" y="135">20 秒</text><text class="legend" x="42" y="30">短间隔最常见</text></svg></div>
    <div class="dist-chart"><h3>A1 与 B1 服务时间</h3><svg viewBox="0 0 320 150" role="img" aria-label="A1 和 B1 服务时间的近似分布"><line class="axis" x1="32" y1="116" x2="306" y2="116"/><path id="a1-service-curve" class="curve-a1"/><path id="b1-service-curve" class="curve-b1"/><text id="a1-service-label" class="legend" x="44" y="26">A1：均值 30 秒</text><text id="b1-service-label" class="legend" x="44" y="46">B1：均值 38 秒</text><text class="tick" x="30" y="135">0</text><text class="tick" x="151" y="135">150</text><text class="tick" x="271" y="135">300 秒</text></svg></div>
    <div class="dist-chart"><h3>A2 与 B2 服务时间</h3><svg viewBox="0 0 320 150" role="img" aria-label="A2 和 B2 服务时间的近似分布"><line class="axis" x1="32" y1="116" x2="306" y2="116"/><path id="a2-service-curve" class="curve-a2"/><path id="b2-service-curve" class="curve-b"/><text id="a2-service-label" class="legend" x="44" y="26">A2：均值 58 秒</text><text id="b2-service-label" class="legend" x="44" y="46">B2：均值 72 秒，方差更大</text><text class="tick" x="30" y="135">0</text><text class="tick" x="151" y="135">150</text><text class="tick" x="271" y="135">300 秒</text></svg></div>
  </div>
</section>
<script>
(() => {
  const frame = document.getElementById('sim-frame');
  const pathForRate = rate => {
    const points = [];
    for (let seconds = 0; seconds <= 20; seconds += 1) {
      const x = 32 + seconds / 20 * 274;
      const y = 116 - 92 * Math.exp(-(rate / 60) * seconds);
      points.push(`${x.toFixed(1)} ${y.toFixed(1)}`);
    }
    return `M${points.join(' L')}`;
  };
  const updateArrivalCurves = (mRate,wRate) => {
    document.getElementById('m-arrival-title').textContent = `男性到达间隔（λ = ${mRate} 人/分）`;
    document.getElementById('w-arrival-title').textContent = `女性到达间隔（λ = ${wRate} 人/分）`;
    document.getElementById('m-arrival-curve').setAttribute('d', pathForRate(mRate));
    document.getElementById('w-arrival-curve').setAttribute('d', pathForRate(wRate));
  };
  const pathForService = (mean, sd) => {
    const points = [];
    for (let seconds = 0; seconds <= 300; seconds += 3) {
      const x = 32 + seconds / 300 * 274;
      const y = 116 - 92 * Math.exp(-0.5 * ((seconds - mean) / sd) ** 2);
      points.push(`${x.toFixed(1)} ${y.toFixed(1)}`);
    }
    return `M${points.join(' L')}`;
  };
  const updateServiceCurves = (phoneProb=30, menstrualProb=20, phoneEnabled=false, menstrualEnabled=false) => {
    const p = phoneEnabled ? phoneProb/100 : 0, q = menstrualEnabled ? menstrualProb/100 : 0;
    const values = { a1:30+60*p, b1:40+60*p+120*q, a2:100+60*p, b2:114+60*p+120*q };
    const spreads = { a1:Math.sqrt(6**2+p*(1-p)*60**2), b1:Math.sqrt(7**2+p*(1-p)*60**2+q*(1-q)*120**2), a2:Math.sqrt(10**2+p*(1-p)*60**2), b2:Math.sqrt(32**2+p*(1-p)*60**2+q*(1-q)*120**2) };
    document.getElementById('a1-service-curve').setAttribute('d',pathForService(values.a1,spreads.a1));
    document.getElementById('b1-service-curve').setAttribute('d',pathForService(values.b1,spreads.b1));
    document.getElementById('a2-service-curve').setAttribute('d',pathForService(values.a2,spreads.a2));
    document.getElementById('b2-service-curve').setAttribute('d',pathForService(values.b2,spreads.b2));
    document.getElementById('a1-service-label').textContent=`A1：均值 ${values.a1.toFixed(1)} 秒`;
    document.getElementById('b1-service-label').textContent=`B1：均值 ${values.b1.toFixed(1)} 秒`;
    document.getElementById('a2-service-label').textContent=`A2：均值 ${values.a2.toFixed(1)} 秒`;
    document.getElementById('b2-service-label').textContent=`B2：均值 ${values.b2.toFixed(1)} 秒，方差更大`;
  };
  updateServiceCurves();
  updateArrivalCurves(8,8);
  window.addEventListener('message', event => {
    if (event.source !== frame.contentWindow || event.data?.type !== 'queue-params') return;
    const { mRate, wRate, phoneProb, menstrualProb, phoneEnabled, menstrualEnabled } = event.data;
    updateArrivalCurves(mRate,wRate);
    updateServiceCurves(phoneProb,menstrualProb,phoneEnabled,menstrualEnabled);
  });
})();
</script>
